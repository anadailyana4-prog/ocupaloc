# Supabase local CLI config (hosted production uses dashboard + linked project).
# See: https://supabase.com/docs/guides/cli/config

project_id = "ocupaloc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:8788"
additional_redirect_urls = ["http://127.0.0.1:8788/**", "http://localhost:8788/**"]

[auth.email]
enable_signup = true
enable_confirmations = false
