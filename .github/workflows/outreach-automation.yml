name: Outreach Automation

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Actiune endpoint outreach-automation"
        required: false
        default: "cycle"

jobs:
  outreach-cycle:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outreach cycle
        env:
          OUTREACH_AUTOMATION_URL: ${{ secrets.OUTREACH_AUTOMATION_URL }}
          OUTREACH_CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
          MANUAL_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          action="${MANUAL_ACTION:-cycle}"
          if [ -z "${OUTREACH_AUTOMATION_URL:-}" ] || [ -z "${OUTREACH_CRON_SECRET:-}" ]; then
            echo "Lipsesc secretele OUTREACH_AUTOMATION_URL sau OUTREACH_CRON_SECRET"
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${OUTREACH_CRON_SECRET}" \
            "${OUTREACH_AUTOMATION_URL}?action=${action}"

  outreach-report:
    if: github.event.schedule == '0 18 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outreach report
        env:
          OUTREACH_AUTOMATION_URL: ${{ secrets.OUTREACH_AUTOMATION_URL }}
          OUTREACH_CRON_SECRET: ${{ secrets.OUTREACH_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${OUTREACH_CRON_SECRET}" \
            "${OUTREACH_AUTOMATION_URL}?action=report"