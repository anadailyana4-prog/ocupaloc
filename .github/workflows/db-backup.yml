name: DB Backup

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    name: Supabase DB Dump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Resolve backup DB URL
        env:
          SUPABASE_PROJECT_REF: tffwoljimpdckvlogyqu
          SUPABASE_DIRECT_DB_URL: ${{ secrets.SUPABASE_DIRECT_DB_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_URL="${SUPABASE_DIRECT_DB_URL:-$SUPABASE_DB_URL}"
          if [ -z "$DB_URL" ]; then
            echo "Missing SUPABASE_DIRECT_DB_URL or SUPABASE_DB_URL secret."
            exit 1
          fi

          python3 scripts/prepare-backup-db-url.py "$DB_URL" backup-pg.env

      - name: Dump schema + data
        run: |
          set -a
          source backup-pg.env
          set +a
          export PGSSLMODE=require
          mkdir -p backups
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          pg_dump \
            -h "$PGHOST" \
            -p "$PGPORT" \
            -U "$PGUSER" \
            -d "$PGDATABASE" \
            --no-owner \
            --no-acl \
            --schema=public \
            --format=custom \
            --file="backups/ocupaloc-${TIMESTAMP}.dump"
          echo "BACKUP_FILE=backups/ocupaloc-${TIMESTAMP}.dump" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
